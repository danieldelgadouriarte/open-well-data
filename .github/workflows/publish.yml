# Publishes the openwelldata package to PyPI when a GitHub release is published.
# PyPI trusted publisher, no tokens. On PyPI, Publishing, pending publisher:
#   project openwelldata, owner danieldelgadouriarte, repo open-well-data, workflow publish.yml, environment pypi
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: owd
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        working-directory: owd
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: owd/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
